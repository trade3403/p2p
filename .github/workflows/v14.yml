name: P2P Remote V0.15.0 UI Redesign - Fixed Windows Padding

on:
  push:
    branches: ['feature/v0.15-*']
    paths:
      - 'desktop/**'
      - 'android/**'
      - 'relay/**'
      - 'installer/**'
      - 'docs/V0.15*'
      - '.github/workflows/v14.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2p-v15-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    name: Prepare checksum-verified NSIS toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official NSIS 3.13 archive
        shell: bash
        run: |
          set -euo pipefail
          expected='BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8'
          mkdir -p dist/nsis
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip' \
            --output dist/nsis/nsis-3.13.zip
          actual="$(sha256sum dist/nsis/nsis-3.13.zip | awk '{print toupper($1)}')"
          if [ "$actual" != "$expected" ]; then
            echo "NSIS checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          test "$(stat -c%s dist/nsis/nsis-3.13.zip)" -gt 1000000
          echo "Verified NSIS 3.13 SHA-256: $actual"
      - name: Publish NSIS toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2p-nsis-3.13
          path: dist/nsis/nsis-3.13.zip
          retention-days: 1

  android:
    name: Android unit tests and debug APK
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without obsolete sdkmanager tools package
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/.android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$sdk_status" -ne 0 ]; then exit "$sdk_status"; fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android tests and build APK
        run: |
          gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: P2PRemote-Android-v0.15.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  relay:
    name: Go Relay tests and race detector
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Test Relay
        working-directory: relay
        run: go test -race -count=1 ./...
      - name: Static analysis
        working-directory: relay
        run: go vet ./...

  windows:
    needs: [nsis]
    name: Windows tests, GUI-subsystem check and portable package
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - name: Retrieve exact commit from the official GitHub archive API
        id: source_archive
        continue-on-error: true
        shell: powershell
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveRoot = Join-Path $env:RUNNER_TEMP ('p2p-v14-archive-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $archiveRoot | Out-Null
          $zip = Join-Path $archiveRoot 'source.zip'
          $uri = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/zipball/' + $env:GITHUB_SHA
          $headers = @{ Authorization = ('Bearer ' + $env:GH_SOURCE_TOKEN); 'User-Agent' = 'p2p-v014-selfhost-ci'; Accept = 'application/vnd.github+json' }
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $zip -UseBasicParsing -TimeoutSec 120
          if ((Get-Item $zip).Length -lt 1024) { throw 'GitHub repository ZIP archive is empty' }
          $unpack = Join-Path $archiveRoot 'extracted'
          Expand-Archive -Path $zip -DestinationPath $unpack -Force
          $root = Get-ChildItem -LiteralPath $unpack -Directory | Select-Object -First 1
          if (-not $root) { throw 'Official archive contains no repository directory' }
          Get-ChildItem -LiteralPath $root.FullName -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'desktop/Cargo.toml'))) {
            throw 'Missing desktop manifest after archive extraction'
          }
          Write-Host ('Verified source archive checkout for commit ' + $env:GITHUB_SHA)

      - uses: actions/checkout@v4
        if: steps.source_archive.outcome == 'failure'

      - name: Prefer Git Bash over WSL for the Rust toolchain action
        shell: powershell
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git Bash not installed at $bash" }
          $gitBin = Split-Path -Parent $bash
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, $gitBin + [Environment]::NewLine, $utf8)
          & $bash -c 'echo Git Bash ready'
          if ($LASTEXITCODE -ne 0) { throw "Git Bash execution failed" }

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Windows build environment
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner: $env:RUNNER_NAME / $env:RUNNER_OS / $env:RUNNER_ARCH"
          rustc --version
          cargo --version
          if (-not (Test-Path "desktop/Cargo.toml")) { throw "Missing desktop/Cargo.toml" }

      - name: Run Rust unit tests
        run: cargo test --manifest-path desktop/Cargo.toml

      - name: Build Windows release executable
        run: cargo build --manifest-path desktop/Cargo.toml --release

      - name: Verify release executable uses Windows GUI subsystem
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'desktop/target/release/p2p-remote.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Release output is not a valid Windows PE executable'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 64 -or $peOffset + 90 -gt $bytes.Length) {
            throw 'Invalid PE header offset'
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
            throw 'Missing PE signature'
          }
          $optionalHeader = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), got $subsystem"
          }
          Write-Host 'Verified: Release EXE uses Windows GUI subsystem; no console window is requested.'

      - name: Download verified NSIS toolchain from preparation job
        uses: actions/download-artifact@v4
        with:
          name: p2p-nsis-3.13
          path: ${{ runner.temp }}/p2p-nsis

      - name: Install portable NSIS toolchain locally
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'p2p-nsis/nsis-3.13.zip'
          $expectedSha256 = 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8'
          if (-not (Test-Path $archive)) { throw "NSIS artifact not found: $archive" }
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NSIS artifact SHA-256 mismatch: $actualSha256"
          }
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'p2p-nsis/extracted'
          New-Item -ItemType Directory -Force -Path $nsisRoot | Out-Null
          Expand-Archive -Path $archive -DestinationPath $nsisRoot -Force
          $found = Get-ChildItem -LiteralPath $nsisRoot -Filter makensis.exe -File -Recurse | Select-Object -First 1
          if (-not $found) { throw 'NSIS artifact does not contain makensis.exe' }
          $nsisDir = Split-Path -Parent $found.FullName
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, $nsisDir + [Environment]::NewLine, $utf8)
          $env:PATH = $nsisDir + ';' + $env:PATH
          & $found.FullName /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'NSIS makensis verification failed' }
          Write-Host "Installed verified NSIS toolchain from job artifact: $($found.FullName)"

      - name: Build per-user Windows installer with NSIS
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location installer
          try {
            makensis /V3 P2PRemote.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS installer compilation failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          if (-not (Test-Path "P2PRemote-Setup-v0.15.0.exe")) { throw "NSIS output file was not generated" }
          Write-Host "Built per-user NSIS installer; user profile and logs remain outside install directory."

      - name: Hash Windows installer
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Resolve-Path 'P2PRemote-Setup-v0.15.0.exe'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + '  P2PRemote-Setup-v0.14.0.exe') |
            Out-File 'P2PRemote-Setup-v0.15.0.sha256' -Encoding ASCII
          Write-Host "Installer SHA256: $hash"

      - name: Package phase-one portable test build and SHA-256
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist\v0.15.0-portable'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item 'desktop/target/release/p2p-remote.exe' (Join-Path $dist 'P2PRemote.exe') -Force
          New-Item -ItemType File -Path (Join-Path $dist 'portable.flag') | Out-Null
          @'
          P2P Remote V0.15.0 - UI redesign engineering build
          Includes a per-user NSIS installer and a portable ZIP for engineering validation.
          Configuration, DPAPI-protected device identity and logs are stored in the data folder beside this executable.
          Portable data is isolated from the installed version; DPAPI remains bound to this Windows user and machine.
          Close hides the main window to the notification area when tray initialization succeeds.
          Use the tray menu's "完全退出" command to stop all sessions and exit.
          '@ | Set-Content -Path (Join-Path $dist 'README.txt') -Encoding UTF8
          $zip = Join-Path $env:GITHUB_WORKSPACE 'P2PRemote-Portable-v0.15.0.zip'
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + '  P2PRemote-Portable-v0.15.0.zip') |
            Out-File (Join-Path $env:GITHUB_WORKSPACE 'P2PRemote-Portable-v0.15.0.sha256') -Encoding ASCII
          Write-Host "Portable package SHA256: $hash"

      - name: Upload phase-one artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2PRemote-Windows-v0.15.0
          path: |
            P2PRemote-Portable-v0.14.2.zip
            P2PRemote-Portable-v0.15.0.sha256
            P2PRemote-Setup-v0.14.0.exe
            P2PRemote-Setup-v0.15.0.sha256
          retention-days: 14
