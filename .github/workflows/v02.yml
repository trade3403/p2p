name: V0.2 Rust / Compose / Relay
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'desktop/**'
      - 'android/**'
      - 'relay/**'
      - 'deploy/**'
      - '.github/workflows/v02.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Rust Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Rust tests
        run: cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Build Windows EXE
        run: cargo build --manifest-path desktop/Cargo.toml --release --locked
      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item desktop/target/release/p2p-remote.exe dist/windows/P2PRemote.exe
          Copy-Item README.md dist/windows/README.md
          Compress-Archive -Path dist/windows/* -DestinationPath P2PRemote-Windows-v0.2.0-test.zip
          (Get-FileHash P2PRemote-Windows-v0.2.0-test.zip -Algorithm SHA256).Hash | Out-File P2PRemote-Windows-v0.2.0-test.sha256 -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: P2PRemote-Windows-v0.2.0-test
          path: |
            P2PRemote-Windows-v0.2.0-test.zip
            P2PRemote-Windows-v0.2.0-test.sha256
          retention-days: 14
  android:
    name: Compose Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Package
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../P2PRemote-Android-v0.2.0-debug.apk
          cd .. && sha256sum P2PRemote-Android-v0.2.0-debug.apk > P2PRemote-Android-v0.2.0-debug.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: P2PRemote-Android-v0.2.0-debug
          path: |
            P2PRemote-Android-v0.2.0-debug.apk
            P2PRemote-Android-v0.2.0-debug.sha256
          retention-days: 14
  relay:
    name: Go Relay Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Resolve Go modules
        working-directory: relay
        run: go mod tidy
      - name: Go tests
        working-directory: relay
        run: go test -race ./...
      - name: Container smoke build
        run: docker build -t p2p-relay:ci ./relay
