name: P2P V0.15 Staging Relay Deploy

on:
  push:
    branches: ['feature/v0.15-*']
    paths:
      - 'relay/**'
      - 'deploy/compose.test.yml'
      - '.github/workflows/deploy-staging-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2p-v015-staging-relay
  cancel-in-progress: false

jobs:
  test:
    name: Test V0.15 Go Relay
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Unit tests with race detector
        working-directory: relay
        run: go test -race -count=1 ./...
      - name: Static analysis
        working-directory: relay
        run: go vet ./...

  deploy-staging:
    name: Deploy V0.15 to isolated p2ptest Relay
    needs: test
    if: github.ref == 'refs/heads/feature/v0.15-ui-redesign'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify isolated staging deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the runner's existing Docker access model. Prefer direct
          # docker-group access; use non-interactive sudo only when that is how
          # this runner was originally provisioned. Never change host permissions.
          if docker info >/dev/null 2>&1; then
            echo "P2P_DOCKER_SUDO=false" >> "$GITHUB_ENV"
            docker compose version
          elif sudo -n docker info >/dev/null 2>&1; then
            echo "P2P_DOCKER_SUDO=true" >> "$GITHUB_ENV"
            sudo -n docker compose version
          else
            echo "::error::Runner has neither direct Docker access nor preconfigured non-interactive sudo access. No host permissions or production services were changed."
            exit 1
          fi

          # Locate the pre-existing test-only token file without printing its contents.
          ENV_FILE=""
          for candidate in \
            "/home/ubuntu/.config/p2p-relay-test/.env" \
            "$HOME/p2p-relay-test-source/deploy/.env.test" \
            "$HOME/p2p-relay-test-source/.env.test" \
            "$HOME/.env.p2ptest"; do
            if [ -f "$candidate" ] && grep -q '^RELAY_ACCESS_TOKEN=.' "$candidate"; then
              ENV_FILE="$candidate"
              break
            fi
          done
          if [ -z "$ENV_FILE" ]; then
            echo "::error::No existing test-only env file with TEST_RELAY_ACCESS_TOKEN was found in the documented runner locations."
            echo "The workflow will not generate or replace the token because Windows/Android clients must use the same test token."
            exit 1
          fi
          echo "P2P_STAGING_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          echo "Existing test token file found; RELAY_ACCESS_TOKEN is present; its contents were not displayed."

      - name: Build and replace only p2p-relay-test
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$P2P_STAGING_ENV_FILE"
          # The existing server env uses RELAY_ACCESS_TOKEN; the isolated
          # staging Compose file expects TEST_RELAY_ACCESS_TOKEN. Map it in
          # process memory without changing or printing the original token.
          set -a
          . "$ENV_FILE"
          set +a
          test -n "${RELAY_ACCESS_TOKEN:-}"
          export TEST_RELAY_ACCESS_TOKEN="$RELAY_ACCESS_TOKEN"
          if [[ "${P2P_DOCKER_SUDO:-false}" == "true" ]]; then
            DOCKER=(sudo -n docker)
          else
            DOCKER=(docker)
          fi
          "${DOCKER[@]}" compose \
            --project-name p2p-relay-test \
            --file deploy/compose.test.yml \
            up -d --build --force-recreate --no-deps relay-test

      - name: Verify deployed V0.15 Relay locally and through HTTPS
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$P2P_STAGING_ENV_FILE"
          set -a
          # Reuse the exact administrator-managed test env file discovered
          # during prerequisite checks; never print its contents.
          . "$ENV_FILE"
          set +a
          test -n "${RELAY_ACCESS_TOKEN:-}"
          TEST_RELAY_ACCESS_TOKEN="$RELAY_ACCESS_TOKEN"
          if [[ "${P2P_DOCKER_SUDO:-false}" == "true" ]]; then
            DOCKER=(sudo -n docker)
          else
            DOCKER=(docker)
          fi

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz | grep -qx 'ok'; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Staging Relay health check did not become ready"
              exit 1
            fi
            sleep 3
          done

          probe() {
            local url="$1"
            local body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              --request POST "$url" \
              --header "Authorization: Bearer ${TEST_RELAY_ACCESS_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{}')"
            if [ "$status" != "400" ] || ! grep -q '"error":"invalid device registration"' "$body"; then
              echo "::error::Expected V0.15 registration handler JSON 400 from $url; received HTTP $status"
              cat "$body"
              rm -f "$body"
              return 1
            fi
            rm -f "$body"
            echo "V0.15 registration route verified: $url (HTTP 400 application response)"
          }

          probe http://127.0.0.1:18080/api/v1/devices/register
          probe https://p2ptest.aikissgo.com/api/v1/devices/register

          "${DOCKER[@]}" inspect p2p-relay-test-relay-test-1 \
            --format 'Deployed image={{.Image}} container={{.Id}} status={{.State.Status}}'
