name: P2P Remote V0.17 Flutter UI Prototype

on:
  push:
    branches: ['feature/v0.17-flutter-ui']
    paths:
      - 'flutter_app/**'
      - 'docs/V0.17-FLUTTER-MIGRATION-AUDIT-PLAN.md'
      - '.github/workflows/v17-flutter-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2p-v17-flutter-ui
  cancel-in-progress: true

jobs:
  android:
    name: Flutter analyze, widget tests and Android APK
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter SDK without elevated runner permissions
        shell: bash
        run: |
          set -euo pipefail
          if command -v flutter >/dev/null 2>&1; then
            FLUTTER_BIN="$(command -v flutter)"
            FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          else
            CACHE_ROOT="${RUNNER_TOOL_CACHE:-$HOME/.cache}"
            FLUTTER_ROOT="$CACHE_ROOT/flutter-stable"
            if [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
              rm -rf "$FLUTTER_ROOT"
              git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
            fi
            FLUTTER_BIN="$FLUTTER_ROOT/bin/flutter"
          fi
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flutter --version
          flutter precache --android
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/.android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$sdk_status" -ne 0 ]; then exit "$sdk_status"; fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Flutter platform runners
        working-directory: flutter_app
        run: flutter create --platforms=windows,android --project-name p2p_remote_ui .
      - name: Analyze, test and build Android
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: P2PRemote-V0.17-Flutter-Android-UI-Prototype
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Flutter analyze, widget tests and Windows build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter SDK without elevated runner permissions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterCommand = Get-Command flutter -ErrorAction SilentlyContinue
          if ($flutterCommand) {
            $flutterBin = Split-Path -Parent $flutterCommand.Source
            $flutterRoot = Split-Path -Parent $flutterBin
          } else {
            $cacheRoot = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { $env:RUNNER_TEMP }
            $flutterRoot = Join-Path $cacheRoot 'flutter-stable'
            $flutterExe = Join-Path $flutterRoot 'bin\flutter.bat'
            if (-not (Test-Path $flutterExe)) {
              if (Test-Path $flutterRoot) { Remove-Item -LiteralPath $flutterRoot -Recurse -Force }
              git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $flutterRoot
              if ($LASTEXITCODE -ne 0) { throw 'Could not clone Flutter stable SDK.' }
            }
            $flutterBin = Join-Path $flutterRoot 'bin'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
          $env:PATH = $flutterBin + ';' + $env:PATH
          flutter --version
          flutter precache --windows
      - name: Enable Windows desktop and generate platform runners
        working-directory: flutter_app
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows,android --project-name p2p_remote_ui .
      - name: Analyze, test and build Windows
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
      - name: Package Windows UI prototype
        working-directory: flutter_app
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path 'build/windows' -Filter 'p2p_remote_ui.exe' -Recurse |
            Select-Object -First 1
          if (-not $exe) { throw 'Flutter Windows executable was not generated.' }
          $package = Join-Path $env:GITHUB_WORKSPACE 'P2PRemote-V0.17-Flutter-Windows-UI-Prototype.zip'
          Compress-Archive -Path (Join-Path $exe.Directory.FullName '*') -DestinationPath $package -Force
          if ((Get-Item $package).Length -lt 100000) { throw 'Windows UI package is unexpectedly small.' }
      - uses: actions/upload-artifact@v4
        with:
          name: P2PRemote-V0.17-Flutter-Windows-UI-Prototype
          path: P2PRemote-V0.17-Flutter-Windows-UI-Prototype.zip
          if-no-files-found: error
          retention-days: 14
