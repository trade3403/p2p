name: V0.20 Public Windows Android E2E

on:
  push:
    branches: ['feature/v0.20-public-remote']
    paths:
      - '.github/workflows/v20-public-e2e.yml'
      - 'qa/public-relay/**'
      - 'android/app/src/androidTest/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2p-v20-public-e2e
  cancel-in-progress: false

jobs:
  windows-host:
    if: github.ref == 'refs/heads/feature/v0.20-public-remote'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real native host
        run: cargo build --manifest-path desktop/Cargo.toml --lib --no-default-features --release
      - run: python -m pip install websocket-client==1.8.0 cryptography==46.0.3
      - name: Real public WSS host and synthetic input target
        env:
          RELAY_ACCESS_TOKEN: ${{ secrets.RELAY_ACCESS_TOKEN }}
        run: python qa/public-relay/run.py host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V020-public-host-evidence
          path: evidence/public-relay-host/
          if-no-files-found: warn
          retention-days: 14

  android-viewer:
    if: github.ref == 'refs/heads/feature/v0.20-public-remote'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Android native engine and instrumentation
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - run: python -m pip install websocket-client==1.8.0 cryptography==46.0.3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android viewer on public relay
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RELAY_ACCESS_TOKEN: ${{ secrets.RELAY_ACCESS_TOKEN }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python qa/public-relay/run.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V020-public-android-evidence
          path: |
            evidence/public-relay-android/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
