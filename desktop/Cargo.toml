[package]
name = "p2p-remote"
version = "0.12.0"
edition = "2021"
license = "Proprietary"
description = "Personal remote desktop Windows host - private source"

[dependencies]
iced = { version = "0.13.1", features = ["tokio", "image"] }
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2.5"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
anyhow = "1"
image = { version = "0.24.9", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
screenshots = "0.8.10"
enigo = { version = "0.6.1", default-features = false }
arboard = { version = "3.6.1", default-features = false }
openh264 = "0.9.9"

[profile.release]
lto = false
codegen-units = 16
strip = true
