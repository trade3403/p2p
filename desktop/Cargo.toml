[package]
name = "p2p-remote"
version = "0.15.0"
edition = "2021"
license = "Proprietary"
description = "Personal remote desktop Windows host - private source"

[dependencies]
iced = { version = "0.13.1", features = ["tokio", "image"] }
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Explicit ring backend avoids rustls 0.23 auto-selection ambiguity when
# transitive dependencies enable both aws-lc-rs and ring Cargo features.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = "0.3"
url = "2.5"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
subtle = "2.6"
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
image = { version = "0.24.9", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
screenshots = "0.8.10"
enigo = { version = "0.6.1", default-features = false }
arboard = { version = "3.6.1", default-features = false }
openh264 = "0.9.9"
tray-icon = "0.19.2"

[profile.release]
lto = false
codegen-units = 16
strip = true
