services:
  relay:
    build: ../relay
    restart: unless-stopped
    environment:
      RELAY_ACCESS_TOKEN: ${RELAY_ACCESS_TOKEN:?Set secure relay token}
    expose:
      - "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay
volumes:
  caddy_data:
  caddy_config:
