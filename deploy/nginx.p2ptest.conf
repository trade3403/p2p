# Ubuntu HOST nginx virtual host for isolated P2P staging relay.
# Only install this file after checking for duplicate server_name entries.
# Bootstrap on HTTP so certbot --nginx can issue/install TLS for this host.
# No browser/client credentials should ever be sent over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name p2ptest.aikissgo.com;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        # WebSocket upgrade support (required for /relay).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
